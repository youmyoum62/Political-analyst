services:
  # ── バックエンド (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: political-analyst-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # Supabase の接続文字列を Render ダッシュボードで設定
      - key: ADMIN_TOKEN
        generateValue: true
      # 本番では OpenAPI ドキュメントを無効化する（main.py が APP_ENV を見る）
      - key: APP_ENV
        value: production
      # 実フロントエンド（Vercel）ドメイン。ブラウザから直接 API を叩く実装を
      # 追加した場合に CORS で許可するオリジン。現状はサーバー間通信のみ。
      - key: ALLOWED_ORIGINS
        value: https://political-analyst-s7s6.vercel.app
