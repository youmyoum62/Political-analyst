services:
  # ── バックエンド (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: political-analyst-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # Supabase の接続文字列を Render ダッシュボードで設定
      - key: ADMIN_TOKEN
        generateValue: true
      # フロントエンドは Vercel に移行済み。
      # ブラウザから直接 API を叩く実装を追加した場合は、ここに Vercel ドメイン
      # （例: https://political-analyst.vercel.app）を追記すること。
      # 現状はサーバー間通信のみのため CORS 設定は影響しない。
      - key: ALLOWED_ORIGINS
        value: https://political-analyst-ui.onrender.com
