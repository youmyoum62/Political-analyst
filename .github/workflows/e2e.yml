name: E2E Smoke

# デプロイ済みサイトに対するクリティカルパスのスモークE2E。
# 主CIは軽量に保ち、E2E（ブラウザDL＋実API）は手動/日次で回す。失敗時はIssue起票。

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *" # 毎日 05:30 JST（20:30 UTC）

permissions:
  contents: read

concurrency:
  group: e2e-smoke
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Warm Render API (avoid cold start flakiness)
        run: curl -s -o /dev/null --max-time 120 https://political-analyst-api.onrender.com/health || true
      - name: Run E2E smoke
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://political-analyst-s7s6.vercel.app
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  notify:
    needs: [e2e]
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: E2E Smoke
