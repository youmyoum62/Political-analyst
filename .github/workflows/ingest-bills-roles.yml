name: Ingest Bills & Roles (manual)

# 法案(衆参)・役職(委員会名簿)を本番DB(Supabase)へ投入する手動ワークフロー。
# 会議録(scheduled-ingest)と異なり年単位データのため schedule はなく手動起動のみ。
# 外部データはネットから自動取得（SmartNews CSV / 衆参公式サイト）、ローカルCSV不要。
#
# 必要な GitHub Secrets:
#   - DATABASE_URL : Supabase 接続文字列。未設定なら自動スキップ。
#
# 出典表記「スマートニュース メディア研究所」(MIT) を UI に明記すること。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DBに書き込まず件数・内訳のみ表示（初回は true 推奨）"
        type: boolean
        default: true
      since_kaiji:
        description: "提出回次がこの値以上の法案のみ対象"
        default: "213"
      sangiin_roles_urls:
        description: "参委員会ページURL（カンマ区切り・任意。空なら衆委員会のみ）"
        default: ""

# 同時実行を抑止
concurrency:
  group: ingest-bills-roles
  cancel-in-progress: false

jobs:
  ingest:
    name: Bills & Roles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard - DATABASE_URL が必要
        id: check
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::warning::DATABASE_URL secret が未設定のためスキップしました。Settings > Secrets で DATABASE_URL を設定してください。"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Ingest bills & roles
        if: steps.check.outputs.run == 'true'
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SINCE_KAIJI: ${{ github.event.inputs.since_kaiji }}
          SANGIIN_URLS: ${{ github.event.inputs.sangiin_roles_urls }}
        run: |
          set -euo pipefail
          DRY=""
          if [ "${DRY_RUN}" = "true" ]; then DRY="--dry-run"; fi
          echo "=== モード dry_run=${DRY_RUN} / since-kaiji=${SINCE_KAIJI} ==="

          echo "--- 衆院法案 ---"
          python scripts/ingest_shugiin_bills.py --since-kaiji "${SINCE_KAIJI}" ${DRY}

          echo "--- 参院法案（参法のみ・hc-名前空間） ---"
          python scripts/ingest_sangiin_bills.py --since-kaiji "${SINCE_KAIJI}" ${DRY}

          echo "--- 役職（衆委員会＋参委員会名簿） ---"
          # 参委員会は一覧から自動巡回（--sangiin-auto）。追加URLがあれば個別指定も併用。
          SANGIIN_ARGS="--sangiin-auto"
          if [ -n "${SANGIIN_URLS}" ]; then
            IFS=',' read -ra URLS <<< "${SANGIIN_URLS}"
            for u in "${URLS[@]}"; do
              SANGIIN_ARGS="${SANGIIN_ARGS} --sangiin-url ${u}"
            done
          fi
          python scripts/ingest_roles.py ${DRY} ${SANGIIN_ARGS}

          echo "=== 完了 ==="
