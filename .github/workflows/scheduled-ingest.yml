name: Scheduled Ingest & Snapshot

# 国会会議録のインジェストとスコア再計算を GitHub Actions ランナー上で直接実行する。
#
# 旧版は本番 API の /admin/ingest/trigger を curl で叩いていたが、その実装は
# 同期処理（run_ingest 完走までレスポンスを返さない）で、Render 無料枠では
# 10 分以上かかり curl/プロキシのタイムアウト（exit 28）で完走できなかった。
# そこでランナー上で scripts/ingest.py を直接実行し、DATABASE_URL で
# 本番 DB(Supabase) に直接書き込む方式に変更した（HTTP 非依存・最大 6 時間）。
#
# 必要な GitHub Secrets（Settings > Secrets and variables > Actions）:
#   - DATABASE_URL   : Supabase 接続文字列（postgresql://...）。未設定なら自動スキップ。
#   - OPENAI_API_KEY : 任意。設定時のみ LLM 品質評価も実行（未設定なら自動スキップ）。
#
# 注: schedule / workflow_dispatch はデフォルトブランチ(main)のワークフローで起動する。

on:
  schedule:
    - cron: "0 18 * * *"   # 毎日 03:00 JST（18:00 UTC）
  workflow_dispatch:
    inputs:
      days:
        description: "取込対象の過去日数"
        default: "90"
      limit:
        description: "取込議員数の上限（0=無制限。初回テストは 30 など小さく）"
        default: "0"
      roster_only:
        description: "名簿の更新と過去議員の無効化のみ（発言取得をスキップ・高速）"
        type: boolean
        default: false

# 同時実行を抑止（重複インジェストを防ぐ）
concurrency:
  group: scheduled-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest & Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard - DATABASE_URL が必要
        id: check
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::warning::DATABASE_URL secret が未設定のためスキップしました。Settings > Secrets で DATABASE_URL（任意で OPENAI_API_KEY）を設定してください。"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Ingest & snapshot
        if: steps.check.outputs.run == 'true'
        env:
          INGEST_DAYS: ${{ github.event.inputs.days || '90' }}
          INGEST_LIMIT: ${{ github.event.inputs.limit || '0' }}
          ROSTER_ONLY: ${{ github.event.inputs.roster_only }}
        run: |
          set -euo pipefail
          if [ "${ROSTER_ONLY}" = "true" ]; then
            echo "名簿のみ更新（roster-only）: 発言取得・LLM・再計算はスキップ"
            python -m scripts.ingest --roster-only
          else
            if [ -n "${OPENAI_API_KEY:-}" ]; then
              echo "LLM 品質評価: 有効"
            else
              echo "LLM 品質評価: 無効（OPENAI_API_KEY 未設定）"
            fi
            echo "会議録インジェスト開始: days=${INGEST_DAYS} limit=${INGEST_LIMIT}"
            python -m scripts.ingest --days "${INGEST_DAYS}" --limit "${INGEST_LIMIT}"
          fi
          echo "完了"
