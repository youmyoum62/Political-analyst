name: Recompute Score Snapshot (manual)

# 指定期間で全アクティブ議員のスコアスナップショットを本番DB(Supabase)へ再計算・書き込む
# 手動ワークフロー。会議録・法案・役職の投入後に実行して立法/影響力スコアを反映させる。
# Render 無料枠の同期 /admin/snapshot/trigger はコールドスタートでタイムアウトしうるため、
# ingest と同じく Actions ランナーで直接実行する方式を採る。
#
# 必要な GitHub Secrets:
#   - DATABASE_URL : Supabase 接続文字列。未設定なら自動スキップ。

on:
  workflow_dispatch:
    inputs:
      period_start:
        description: "集計期間の開始日 (ISO, 例 2024-01-01)"
        required: true
        default: "2024-01-01"
      period_end:
        description: "集計期間の終了日 (ISO, 例 2026-06-05)"
        required: true
        default: "2026-06-05"

# 同時実行を抑止
concurrency:
  group: recompute-snapshot
  cancel-in-progress: false

jobs:
  recompute:
    name: Recompute Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard - DATABASE_URL が必要
        id: check
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::warning::DATABASE_URL secret が未設定のためスキップしました。Settings > Secrets で DATABASE_URL を設定してください。"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Recompute snapshot
        if: steps.check.outputs.run == 'true'
        env:
          PERIOD_START: ${{ github.event.inputs.period_start }}
          PERIOD_END: ${{ github.event.inputs.period_end }}
        run: |
          set -euo pipefail
          python scripts/recompute_snapshot.py \
            --period-start "${PERIOD_START}" \
            --period-end "${PERIOD_END}"
