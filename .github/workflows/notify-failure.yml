name: Notify Failure

# 再利用ワークフロー。データ系ワークフローが失敗したら GitHub Issue を自動起票する。
# 過去に法案投入が silent に失敗して長く気づけなかった経緯への対策（improvement_plan ⑥）。
# 同名の open issue があれば重複起票しない。

on:
  workflow_call:
    inputs:
      workflow_name:
        required: true
        type: string

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const wf = ${{ toJSON(inputs.workflow_name) }};
            const title = `⚠ ${wf} が失敗しました`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `ワークフロー **${wf}** の実行が失敗しました。`,
              '',
              `- 実行ログ: ${runUrl}`,
              `- コミット: ${context.sha}`,
              '',
              '原因を確認し、対応後にこの Issue をクローズしてください。',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-failure', per_page: 100,
            });
            if (existing.data.some((i) => i.title === title)) {
              core.info('同名の open issue が既に存在するため起票をスキップします。');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['ci-failure'],
            });
