name: Diagnose DB Connectivity

# GitHub Actions ランナーから Supabase への到達性を診断する使い捨てワークフロー。
# DB への書き込みは行わず、egress IP / DNS / TCP 到達性 / psycopg2 接続可否のみを確認する。
# 原因切り分け（IP 制限・ban か、汎用ネット障害か、DB 自体の不調か）が目的。
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Runner egress IP
        run: |
          echo "Runner egress IP:"
          curl -s --max-time 10 https://api.ipify.org || echo "(IP取得失敗)"
          echo

      - name: DNS / TCP reachability
        run: |
          python3 - <<'PY'
          import os, socket, sys, time
          from urllib.parse import urlparse
          url = os.environ.get("DATABASE_URL", "")
          if not url:
              print("DATABASE_URL 未設定"); sys.exit(1)
          p = urlparse(url)
          host, port = p.hostname, (p.port or 5432)
          # secret 本体は出さず、host/port のみ表示（ログで既知の情報）
          print(f"target host={host} port={port}")
          try:
              infos = socket.getaddrinfo(host, port, proto=socket.IPPROTO_TCP)
              ips = sorted({i[4][0] for i in infos})
              print(f"DNS OK: {ips}")
          except Exception as e:
              print(f"DNS FAIL: {e!r}")
          t0 = time.time()
          try:
              s = socket.create_connection((host, port), timeout=10); s.close()
              print(f"TARGET TCP OK in {time.time()-t0:.1f}s")
          except Exception as e:
              print(f"TARGET TCP FAIL in {time.time()-t0:.1f}s: {e!r}")
          for ch, cp in [("api.ipify.org", 443), ("google.com", 443)]:
              try:
                  s = socket.create_connection((ch, cp), timeout=10); s.close()
                  print(f"CONTROL {ch}:{cp} OK")
              except Exception as e:
                  print(f"CONTROL {ch}:{cp} FAIL: {e!r}")
          PY

      - name: psycopg2 connect test
        run: |
          pip install "psycopg2-binary>=2.9" >/dev/null
          python3 - <<'PY'
          import os, time
          import psycopg2
          url = os.environ["DATABASE_URL"]
          t0 = time.time()
          try:
              conn = psycopg2.connect(url, connect_timeout=10)
              cur = conn.cursor(); cur.execute("select 1"); print("DB CONNECT OK:", cur.fetchone())
              cur.close(); conn.close()
          except Exception as e:
              print(f"DB CONNECT FAIL in {time.time()-t0:.1f}s: {e!r}")
          PY

      - name: Score coverage diagnostics (read-only)
        run: |
          pip install "psycopg2-binary>=2.9" >/dev/null
          python3 - <<'PY'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"], connect_timeout=15)
          cur = conn.cursor()

          def q(sql):
              cur.execute(sql); return cur.fetchall()

          print("=== [1] 法案sponsorが紐づく現職(is_active)議員数 by house ===")
          for row in q("""
              SELECT p.house, count(DISTINCT bs.politician_id)
              FROM bill_sponsors bs JOIN politicians p ON p.id=bs.politician_id
              WHERE p.is_active=true GROUP BY p.house ORDER BY p.house;
          """):
              print("  house=%s distinct_active_sponsors=%s" % row)

          print("=== [1b] sponsor_role別・現職の紐づき議員数 ===")
          for row in q("""
              SELECT bs.sponsor_role, count(DISTINCT bs.politician_id)
              FROM bill_sponsors bs JOIN politicians p ON p.id=bs.politician_id
              WHERE p.is_active=true GROUP BY bs.sponsor_role ORDER BY bs.sponsor_role;
          """):
              print("  role=%s distinct_active=%s" % row)

          print("=== [1d] bills.submitted_date 分布（period外/NULLが計算漏れの原因か検証）===")
          for row in q("""
              SELECT
                count(*) AS total_bills,
                count(*) FILTER (WHERE submitted_date IS NULL) AS date_null,
                count(*) FILTER (WHERE submitted_date < DATE '2024-01-01') AS before_2024,
                count(*) FILTER (WHERE submitted_date BETWEEN DATE '2024-01-01' AND DATE '2026-07-04') AS in_range,
                min(submitted_date) AS min_sd, max(submitted_date) AS max_sd
              FROM bills;
          """):
              print("  total=%s null=%s before2024=%s in_range=%s min=%s max=%s" % row)

          print("=== [1e] submitted_date が period内の法案に紐づく現職議員数（=現状leg計算の母数の実態）===")
          for row in q("""
              SELECT count(DISTINCT bs.politician_id)
              FROM bill_sponsors bs
              JOIN politicians p ON p.id=bs.politician_id AND p.is_active=true
              JOIN bills b ON b.id=bs.bill_id
              WHERE b.submitted_date BETWEEN DATE '2024-01-01' AND DATE '2026-07-04';
          """):
              print("  submitted_date in-range の sponsor現職議員数=%s" % row)

          print("=== [1c] bills件数 by status / bill_sponsors総数 ===")
          for row in q("SELECT status, count(*) FROM bills GROUP BY status ORDER BY status;"):
              print("  bill.status=%s count=%s" % row)
          print("  bill_sponsors総数:", q("SELECT count(*) FROM bill_sponsors;")[0][0])

          print("=== [2a] score_components 全体サマリ ===")
          for row in q("""
              SELECT count(*) AS total_rows,
                     count(DISTINCT computed_at) AS distinct_computed_at,
                     min(computed_at) AS min_ca, max(computed_at) AS max_ca,
                     min(period_end) AS min_pe, max(period_end) AS max_pe
              FROM score_components;
          """):
              print("  total_rows=%s distinct_computed_at=%s\n  min_ca=%s max_ca=%s\n  min_period_end=%s max_period_end=%s" % row)

          print("=== [2b] period別: 行数・distinct computed_at・各軸>0（DB側で集計）===")
          for row in q("""
              SELECT period_start, period_end,
                     count(*) AS rows,
                     count(DISTINCT computed_at) AS n_ca,
                     max(computed_at) AS max_ca,
                     count(*) FILTER (WHERE legislative_score>0) AS leg_gt0,
                     count(*) FILTER (WHERE policy_impact_score>0) AS pol_gt0,
                     count(*) FILTER (WHERE influence_score>0) AS inf_gt0
              FROM score_components
              GROUP BY period_start, period_end
              ORDER BY period_end;
          """):
              print("  %s..%s rows=%s n_ca=%s max_ca=%s leg>0=%s pol>0=%s inf>0=%s" % row)

          print("=== [3] latest-per-politician（DISTINCT ON, computed_at DESC）×法案sponsor有無 クロス集計 ===")
          for row in q("""
              WITH latest AS (
                SELECT DISTINCT ON (politician_id)
                       politician_id, legislative_score, policy_impact_score
                FROM score_components
                ORDER BY politician_id, computed_at DESC
              ),
              spons AS (SELECT DISTINCT politician_id FROM bill_sponsors)
              SELECT
                count(*) AS active_total,
                count(*) FILTER (WHERE s.politician_id IS NOT NULL) AS has_sponsors,
                count(*) FILTER (WHERE s.politician_id IS NOT NULL AND l.legislative_score>0) AS sp_and_leg_gt0,
                count(*) FILTER (WHERE s.politician_id IS NOT NULL AND l.legislative_score=0) AS sp_but_leg0,
                count(*) FILTER (WHERE l.legislative_score>0) AS leg_gt0_total,
                count(*) FILTER (WHERE l.policy_impact_score>0) AS pol_gt0_total
              FROM latest l
              JOIN politicians p ON p.id=l.politician_id AND p.is_active=true
              LEFT JOIN spons s ON s.politician_id=l.politician_id;
          """):
              print("  active_total=%s has_sponsors=%s\n  sp&leg>0=%s  sp&leg=0(=バグ母数)=%s\n  leg>0_total=%s pol>0_total=%s" % row)

          cur.close(); conn.close()
          PY
